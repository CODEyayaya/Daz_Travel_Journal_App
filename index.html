<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal de daz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <button class="menu-btn" id="menu-btn">☰</button>
  </header>

  <div class="overlay" id="overlay"></div>

  <nav class="side-menu" id="side-menu">
    <button class="close-btn" id="close-btn">✕</button>
    <ul>
      <li id="nav-home">Home</li>
      <li id="nav-visited">Visited</li>
      <li id="nav-tovisit">To Visit</li>
      <li id="nav-entries">Entries</li>
      <li id="nav-people">People</li>
    </ul>
  </nav>

  <section id="view-home" class="view active">
    <main class="globe-screen">
      <div class="globe-wrap">
        <div id="globe-container">
          <!-- the actual globe will render here later -->
        </div>
        <div class="zoom-controls">
          <button id="zoom-in">+</button>
          <button id="zoom-out">−</button>
        </div>
      </div>
      <div class="below-globe">
        <button id="memory-spin-btn">Memory Spin</button>

        <div class="pin-popup" id="pin-popup">
          <h3 id="pin-popup-country">Country</h3>
          <div class="pin-popup-buttons">
            <button id="popup-view-memories">View Memories</button>
            <button id="popup-add-memory">Add Memory</button>
          </div>
          <button id="popup-close" class="popup-close-btn">✕</button>
        </div>


        <div class="memory-options" id="memory-options">
            <h3 id="memory-options-country">Country</h3>
            <div class="memory-options-list">
                <button class="memory-option-btn" data-type="journal">+ Journal</button>
                <button class="memory-option-btn" data-type="people">+ People</button>
                <button class="memory-option-btn" data-type="note">+ Note</button>
                <button class="memory-option-btn" data-type="photos">+ Photos</button>
            </div>
            <button id="memory-options-close" class="popup-close-btn">✕</button>
        </div>

      </div>
    </main>
  </section>

  <section id="view-visited" class="view">
    <h2>Visited</h2>
  </section>

  <section id="view-tovisit" class="view">
    <h2>To Visit</h2>
  </section>

  <section id="view-entries" class="view">
    <h2>Entries</h2>
  </section>

  <section id="view-people" class="view">
    <h2>People</h2>
  </section>

  <div class="journal-editor" id="journal-editor">
    <div class="journal-editor-header">
      <button id="journal-back-btn" class="journal-icon-btn">← Back</button>
      <span id="journal-editor-location" class="journal-location-tag"></span>
      <button id="journal-save-btn" class="journal-icon-btn journal-save-btn">Save</button>
    </div>
    <input type="text" id="journal-title-input" class="journal-title-input" placeholder="Title">
    <input type="date" id="journal-date-input" class="journal-date-input">
    <textarea id="journal-body-input" class="journal-body-input" placeholder="Write your journal entry..."></textarea>
  </div>

  <div class="people-editor" id="people-editor">
    <div class="people-editor-header">
        <button id="people-back-btn" class="journal-icon-btn">← Back</button>
        <span id="people-editor-location" class="journal-location-tag"></span>
        <button id="people-save-btn" class="journal-icon-btn journal-save-btn">Save</button>
    </div>

    <div class="people-field">
        <label>Name</label>
        <input type="text" id="people-name-input" placeholder="Name">
    </div>
    <div class="people-field">
        <label>From</label>
        <input type="text" id="people-from-input" placeholder="Where they're from">
    </div>
    <div class="people-field">
        <label>Met where</label>
        <input type="text" id="people-metwhere-input" placeholder="City / place you met">
    </div>
    <div class="people-field">
        <label>Instagram</label>
        <input type="text" id="people-insta-input" placeholder="@handle">
    </div>
    <div class="people-field">
        <label>WhatsApp</label>
        <input type="text" id="people-whatsapp-input" placeholder="Number">
    </div>
    <div class="people-field">
        <label>Note</label>
        <textarea id="people-note-input" placeholder="Anything you want to remember about them..."></textarea>
    </div>
</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, getDocs, doc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_WkzK_YNf8rBbU8vgWu0nUafh44yVRUg",
      authDomain: "journal-de-dazz.firebaseapp.com",
      projectId: "journal-de-dazz",
      storageBucket: "journal-de-dazz.firebasestorage.app",
      messagingSenderId: "476155475149",
      appId: "1:476155475149:web:1f677fbca643ed5c1be584"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.firestoreFns = { collection, addDoc, getDocs, doc, updateDoc, serverTimestamp };
  </script>

  <script src="//unpkg.com/globe.gl" defer></script>
  <script src="app.js" defer></script>

</body>
</html>
